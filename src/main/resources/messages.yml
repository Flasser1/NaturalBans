#This is the messages file
#In here you will find all messages that the plugin can send.
#You can edit all of these messages to your liking.

#In each segment you can find information on what it contains.
#But you can also find information on what placeholders you can use there!

#The placeholder {prefix} is available everywhere
#{prefix} - this will return the prefix

#This is the prefix
prefix: "&c&lNatural&f&lBans &8- &f"

#List of all error messages
no_permission: "{prefix}You do not have the required permission(s)!"
missing_player: "{prefix}You need to specify a player!"
missing_duration: "{prefix}You need to specify a duration!"
not_joined_before: "{prefix}That player has not joined before!"
invalid_duration: "{prefix}That is not a valid duration!"
not_online: "{prefix}That player is not online!"
missing_mute: "{prefix}That player has no such active punishment!"
missing_ban: "{prefix}That player has no such active punishment!"

#List of broadcast messages
#
#In this list, the loud messages are broadcasted for all to see
#The silent messages can only be seen by those with the sufficient permissions
#
#{target} - this will return the targeted player
#{expires} - this will return the duration for the punishment
#{player} - this will return the executor of the punishment
ban_success_loud: "{prefix}The player &c{target} &fhas been banned till &c{expires} &fby &c{player}"
unban_success_loud: "{prefix}The player &c{target} &fhas been unbanned &fby &c{player}"
mute_success_loud: "{prefix}The player &c{target} &fhas been muted till &c{expires} &fby &c{player}"
unmute_success_loud: "{prefix}The player &c{target} &fhas been unmuted &fby &c{player}"
kick_success_loud: "{prefix}The player &c{target} &fhas been kicked by &c{player}"
ban_success_silent: "{prefix}The player &c{target} &fhas been banned till &c{expires} &fby &c{player} &7(silent)"
unban_success_silent: "{prefix}The player &c{target} &fhas been unbanned &fby &c{player} &7(silent)"
mute_success_silent: "{prefix}The player &c{target} &fhas been muted till &c{expires} &fby &c{player} &7(silent)"
unmute_success_silent: "{prefix}The player &c{target} &fhas been unmuted &fby &c{player} &7(silent)"
kick_success_silent: "{prefix}The player &c{target} &fhas been kicked by &c{player} &7(silent)"

#List of all command success mesages
#
#This list is for all non-broadcast messages that come from a command.
#
#{target} - this will return the targeted player
alts_success: "{prefix}The player {target} has logged in from the same IP as:"

#The message the muted player gets when trying to speak.
isMuted: "{prefix}You have been muted, and can therefore not speak!"

#The ban screen
#
#You can add new lines here, and they will appear on the ban screen.
#
#
ban_screen:
  - ""

kick_screen:
  - ""